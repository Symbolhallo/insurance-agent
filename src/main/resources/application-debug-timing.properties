# 仅供本地断点调试使用的时间参数覆盖。
# 不要在生产环境启用 debug-timing；IDEA 中推荐启用组合 Profile：local-debug。

# 断点暂停期间延长 SSE 连接和重放窗口，实时扫描及 Token 刷新频率保持不变。
insurance.ai.workflow.sse.connection-timeout=4h
insurance.ai.workflow.sse.event-retention=4h
insurance.ai.workflow.sse.database-poll-interval=500ms
insurance.ai.workflow.sse.token-batch-max-delay=80ms
insurance.ai.workflow.sse.token-batch-max-characters=128

# 调试期间推迟物理清理，并保留低频恢复扫描能力。
insurance.ai.workflow.maintenance.cleanup-initial-delay=4h
insurance.ai.workflow.maintenance.cleanup-interval=4h
insurance.ai.workflow.maintenance.sse-cleanup-initial-delay=4h
insurance.ai.workflow.maintenance.sse-cleanup-interval=4h
insurance.ai.workflow.maintenance.recovery-interval=5m

# Suspend All 会暂停 heartbeat，因此放宽执行、抢占和人工确认租约。
insurance.ai.workflow.lifecycle.execution-lease=4h
insurance.ai.workflow.lifecycle.claim-lease=4h
insurance.ai.workflow.lifecycle.waiting-confirm-lease=7d
# 仍严格短于4小时 execution-lease 和 claim-lease。
insurance.ai.workflow.lifecycle.heartbeat-interval=3h
