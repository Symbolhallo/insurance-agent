# Web 服务基础配置。
# 应用监听端口；本地 Swagger UI 默认访问 http://localhost:8080/swagger-ui.html。
server.port=8080
# 收到停机信号后停止接收新请求，并等待正在处理的请求结束。
server.shutdown=graceful

# Spring 应用名，用于日志、监控以及未来服务注册标识。
spring.application.name=insurance-agent

# IDEA 长时间断点调试组合：先启用本地数据库，再用 debug-timing 覆盖易过期参数。
# IDEA Active profiles 只填写 local-debug，不要把环境变量写在这里。
spring.profiles.group.local-debug[0]=local-db
spring.profiles.group.local-debug[1]=debug-timing

# 默认 profile 不连接数据库，使模型、Agent、Skill 和 Tool 可以独立启动验证。
# local-db Profile 会通过 application-local-db.properties 的空值恢复 DataSource 和 Flyway。
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# 优雅停机每个阶段最多等待30秒，超时后 Spring 继续关闭应用上下文。
spring.lifecycle.timeout-per-shutdown-phase=30s

# 可信身份由上游网关写入 X-Tenant-Id/X-User-Id/X-Customer-Id/X-Operator-Id。
# 本地默认关闭强制请求头，方便 IDEA 和 Swagger 调试；生产环境必须通过环境变量开启。
insurance.security.identity.require-headers=${IDENTITY_HEADERS_REQUIRED:false}
insurance.security.identity.default-tenant-id=${DEFAULT_TENANT_ID:local-tenant}
insurance.security.identity.default-user-id=${DEFAULT_USER_ID:mock-user}
insurance.security.identity.default-customer-id=${DEFAULT_CUSTOMER_ID:MOCK-CUSTOMER-001}
insurance.security.identity.default-operator-id=${DEFAULT_OPERATOR_ID:mock-operator}

# AgentScope 使用 OpenAI-compatible 协议连接模型服务；密钥必须从环境变量读取。
insurance.ai.model.api-key=${AI_API_KEY:}
# 模型服务基础地址；未配置时使用 DashScope OpenAI 兼容地址。
insurance.ai.model.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
# 对话模型名称，例如 deepseek-chat 或 qwen-plus。
insurance.ai.model.model-name=${AI_MODEL:qwen-plus}
# 采样温度0.2偏向稳定、可复现的金融业务回答。
insurance.ai.model.temperature=${AI_TEMPERATURE:0.2}

# AgentScope AG-UI 直连领域 Agent 的单次 SSE 最长运行时间。
insurance.ai.agui.run-timeout=10m

# 仅通过 HTTP 暴露健康检查和应用信息，避免开放敏感管理端点。
management.endpoints.web.exposure.include=health,info
# 开启 liveness/readiness 健康探针，便于未来容器平台接入。
management.endpoint.health.probes.enabled=true

# springdoc-openapi 与 Swagger UI。
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true

# 输出时间、级别、线程、MDC traceId、logger和正文；没有traceId时显示“-”。
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n
# 第三方依赖与项目代码默认记录 INFO 及以上日志。
logging.level.root=INFO
logging.level.com.xxx.insurance=INFO

# 单次领域 HarnessAgent 最多执行8轮 ReAct，防止模型与 Tool 失控循环。
insurance.ai.agent.safety.max-iterations=8
