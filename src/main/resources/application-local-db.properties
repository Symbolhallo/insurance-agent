# local-db Profile 的增量配置。
# 启动方式：--spring.profiles.active=local-db。该文件在 application.properties 之后加载，
# 用于启用 OceanBase、Flyway、MyBatis、Graph Checkpoint、SSE事实表和租约恢复任务。

# 清空 application.properties 的自动配置排除项，恢复 DataSource 和 Flyway 自动配置。
spring.autoconfigure.exclude=

# OceanBase 使用 MySQL 兼容模式，因此使用 MySQL JDBC 驱动。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 默认连接本机2881端口；生产或不同环境必须通过 DB_URL 覆盖。
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:2881/insurance_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# 密码只从环境变量读取；空默认值仅适配当前本地 OceanBase。
spring.datasource.password=${DB_PASSWORD:}

# local-db 启动时校验并执行尚未应用的 Flyway 数据库迁移。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# 将数据库 snake_case 字段自动映射为 Java camelCase 属性。
mybatis.configuration.map-underscore-to-camel-case=true

# 每个 conversationId 最多保留20条 AgentScope 短期窗口消息；长期历史不受该值影响。
insurance.ai.memory.max-messages=20

# Spring AI Alibaba Graph 状态快照保留与写入策略。
insurance.ai.workflow.checkpoint.active-retention=7d
insurance.ai.workflow.checkpoint.completed-retention=24h
insurance.ai.workflow.checkpoint.state-schema-version=1
insurance.ai.workflow.checkpoint.max-write-retries=5

# SSE HTTP连接、事件重放、多实例扫描和模型增量合并配置。
insurance.ai.workflow.sse.connection-timeout=5m
insurance.ai.workflow.sse.event-retention=10m
insurance.ai.workflow.sse.database-poll-interval=500ms
insurance.ai.workflow.sse.token-batch-max-delay=80ms
insurance.ai.workflow.sse.token-batch-max-characters=128

# Checkpoint、SSE和失效执行权的定时维护周期。
insurance.ai.workflow.maintenance.cleanup-initial-delay=1m
insurance.ai.workflow.maintenance.cleanup-interval=1h
insurance.ai.workflow.maintenance.sse-cleanup-initial-delay=30s
insurance.ai.workflow.maintenance.sse-cleanup-interval=30s
insurance.ai.workflow.maintenance.recovery-interval=30s

# 多实例执行所有权、抢占和 heartbeat 配置。
insurance.ai.workflow.lifecycle.execution-lease=15m
insurance.ai.workflow.lifecycle.claim-lease=2m
insurance.ai.workflow.lifecycle.waiting-confirm-lease=24h
insurance.ai.workflow.lifecycle.heartbeat-interval=1m
