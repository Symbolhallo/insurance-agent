spring:
  autoconfigure:
    exclude: []
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:2881/insurance_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

insurance:
  ai:
    workflow:
      checkpoint:
        active-retention: 90d
        completed-retention: 30d
        state-schema-version: 1
        max-write-retries: 5
      sse:
        connection-timeout: 5m
        event-retention: 7d
