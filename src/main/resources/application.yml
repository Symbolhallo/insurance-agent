# Web 服务基础配置。
server:
  # 应用监听端口；本地 Swagger UI 默认访问 http://localhost:8080/swagger-ui.html。
  port: 8080
  # 收到停机信号后停止接收新请求，并等待正在处理的请求结束。
  shutdown: graceful

spring:
  application:
    # Spring 应用名，用于日志、监控以及未来服务注册标识。
    name: insurance-agent
  profiles:
    group:
      # IDEA 长时间断点调试组合：先启用本地数据库，再用 debug-timing 覆盖易过期参数。
      # IDEA Active profiles 只填写 local-debug，不要把环境变量写在这里。
      local-debug:
        - local-db
        - debug-timing
  # 默认 profile 不连接数据库，使模型、Agent、Skill 和 Tool 可以独立启动验证。
  # 启用 local-db profile 时，application-local-db.yml 使用空列表恢复这两项自动配置。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  lifecycle:
    # 优雅停机每个阶段最多等待30秒，超时后 Spring 继续关闭应用上下文。
    timeout-per-shutdown-phase: 30s

# Spring Boot Actuator 运维端点配置。
management:
  endpoints:
    web:
      exposure:
        # 仅通过 HTTP 暴露健康检查和应用信息，避免开放敏感管理端点。
        include: health,info
  endpoint:
    health:
      probes:
        # 开启 liveness/readiness 健康探针分组，便于未来容器平台接入。
        enabled: true

# springdoc-openapi 与 Swagger UI 配置。
springdoc:
  api-docs:
    # 生成 OpenAPI JSON 文档。
    enabled: true
    # OpenAPI JSON 地址。
    path: /v3/api-docs
  swagger-ui:
    # 启用浏览器接口调试页面。
    enabled: true
    # Swagger UI 入口地址。
    path: /swagger-ui.html
    # 在页面中展示每次 HTTP 请求耗时。
    display-request-duration: true

# 统一日志格式和级别。
logging:
  pattern:
    # 输出时间、级别、线程、MDC traceId、logger和正文；没有traceId时显示“-”。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    # 第三方依赖默认只记录 INFO 及以上日志。
    root: INFO
    # 当前项目代码默认记录 INFO 及以上日志；本地排障可临时改为 DEBUG。
    com.xxx.insurance: INFO

# AgentScope 模型、AG-UI 和 HarnessAgent 运行配置。
insurance:
  # 可信网关身份配置。本地默认允许回退值；生产部署必须把 IDENTITY_HEADERS_REQUIRED 设为 true。
  security:
    identity:
      require-headers: ${IDENTITY_HEADERS_REQUIRED:false}
      default-tenant-id: ${DEFAULT_TENANT_ID:local-tenant}
      default-user-id: ${DEFAULT_USER_ID:mock-user}
      default-customer-id: ${DEFAULT_CUSTOMER_ID:MOCK-CUSTOMER-001}
      default-operator-id: ${DEFAULT_OPERATOR_ID:mock-operator}
  ai:
    # AgentScope OpenAI-compatible Model 配置；DeepSeek、DashScope兼容模式均可复用。
    model:
      # 模型密钥从环境变量读取，禁止在配置文件或代码中提交真实密钥。
      api-key: ${AI_API_KEY:}
      # 模型服务基础地址；AgentScope 会自动拼接 /v1/chat/completions。
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 对话模型名称，可通过 AI_MODEL 切换，例如 deepseek-chat 或 qwen-plus。
      model-name: ${AI_MODEL:qwen-plus}
      # 采样温度；0.2偏向稳定、可复现的金融业务回答。
      temperature: ${AI_TEMPERATURE:0.2}
    agui:
      # 领域 Agent AG-UI SSE 单次最长运行10分钟；该入口不提供 Main Graph 事件重放。
      run-timeout: 10m
    agent:
      safety:
        # 单次领域 HarnessAgent 最多执行8轮 ReAct；正常一次 Tool 循环通常只需2轮。
        max-iterations: 8
